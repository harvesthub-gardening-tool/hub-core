[package]
name = "probe-grpc"
version = "0.1.0"
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "probe-grpc"
path = "src/main.rs"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
anyhow = "1"
bstr = "1.11"
log = "0.4"
esp-idf-svc = "0.52.1"
esp32-nimble = "0.12.0"
tokio = { version = "1.48", features = ["rt", "macros", "time", "net", "sync"] }

tonic = { version = "0.14.5", features = ["transport"] }
prost = "0.14.3"
protos-rust = { git = "https://github.com/harvesthub-gardening-tool/protos-rust" }

[features]
default = []
# Inject one synthetic SensorReading per scan cycle. Used to verify the
# gRPC uplink end-to-end without a physical BLE probe in range.
fake-probe = []

[build-dependencies]
embuild = "0.33"