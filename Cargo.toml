[package]
name = "hub-core"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4.28"

[target.xtensa-esp32s3-none-elf.dependencies]
esp-hal     = { version = "1.0.0", features = ["esp32s3", "unstable", "rt"] }
esp-println = { version = "0.16.1", features = ["esp32s3", "log-04"] }
esp-sync    = { version = "0.1.1", features = ["esp32s3"] }
esp-rom-sys = { version = "0.1.3", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.18.1", features = ["esp32s3", "panic-handler", "println", "colors"] }

embassy-executor = { version = "0.9.1", default-features = false }
embassy-time     = { version = "0.5.0", default-features = false }


[profile.dev]
opt-level = "s"
panic = "abort"

[profile.release]
opt-level = "s"
panic = "abort"
lto = "fat"
codegen-units = 1

[lib]
test = false
bench = false


[[bin]]
name = "hub-core-fw"
path = "src/bin/firmware.rs"
test = false
bench = false